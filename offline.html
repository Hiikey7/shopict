<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e30613">
  <title>You're offline · Shop ICT Gadgets</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; color: #333e48; }
    .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 32px 26px; text-align: center; }
    img { height: 64px; width: auto; margin-bottom: 18px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 20px; line-height: 1.6; color: #5f666d; }
    .btn { display: block; width: 100%; padding: 12px 16px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: none; }
    .btn-red { background: #e30613; color: #fff; }
    .btn-wa { background: #25d366; color: #fff; margin-top: 10px; }
    .btn:focus-visible { outline: 3px solid #333e48; outline-offset: 2px; }
    .contact { margin: 18px 0 0; font-size: 14px; }
    .contact a { color: #333e48; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/images/logo/logo.png" alt="Shop ICT Gadgets">
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again. Pages you opened recently may still be available.</p>
    <button class="btn btn-red" type="button" onclick="location.reload()">Try again</button>
    <a class="btn btn-wa" href="https://wa.me/254713869018">Chat on WhatsApp</a>
    <p class="contact">Call us: <a href="tel:+254713869018">+254 713 869 018</a><br>Nairobi, Laxmi Plaza, 3rd Flr, Room No 5</p>
  </main>
</body>
</html>
